# Example mapping file for contact-cleaner. Every key is optional.
# Pass it with:  contact-cleaner clean INPUT --out OUTDIR --mapping mapping.example.yaml

# Country used for phone numbers written without a country code (two-letter code).
default_country: GB

# Force a source column for a field when the guess is wrong.
# Use null to stop a column being mapped (it then goes to passthrough.csv).
columns:
  # email: "Primary E-mail"
  # company: "Client"
  # salutation: null

# Output header for each field. Change these to target another CRM.
targets:
  salutation: Salutation
  first_name: First name
  last_name: Last name
  name_suffix: Name suffix
  email: Email
  phone: Phone number
  mobile: Mobile phone number
  company: Company name
  job_title: Job title
  address: Street address
  city: City
  postcode: Postal code
  country: Country/Region
  date_added: Date added

# Switch rules on (true) or off (false).
rules:
  whitespace: true
  name_case: true
  split_name: true
  email: true
  apply_email_suggestions: false   # true = replace typo domains such as gmial.com
  phone: true
  dates: true
  day_first: true                  # false = read 03/04/2021 as 4 March
  postcode: true
  dedupe_exact: true
  flag_likely_duplicates: true
  reject_no_contact: true
  formula_guard: true              # apostrophe before values a spreadsheet would run as a formula
  strict_contact_columns: true     # take uncertain emails and phones out of the clean file
