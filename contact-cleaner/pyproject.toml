[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contact-cleaner"
version = "1.0.0"
description = "Clean a messy contact spreadsheet into a CRM-ready import file."
requires-python = ">=3.11"
dependencies = ["openpyxl==3.1.5", "phonenumbers==8.13.50", "PyYAML==6.0.2"]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[project.scripts]
contact-cleaner = "contact_cleaner.cli:main"

[tool.setuptools]
packages = ["contact_cleaner"]
